<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Supplier Form')"></head>
<body>
<div class="d-flex">
    <div th:replace="fragments/sidebar :: sidebar('suppliers')"></div>
    <div class="flex-grow-1">
        <div class="topbar p-3">
            <h4 class="mb-0" th:text="${supplier.id == null} ? 'Add Supplier' : 'Edit Supplier'">Add</h4>
        </div>
        <div class="p-4">
            <form th:action="@{/suppliers/save}" th:object="${supplier}" method="post" class="card form-card border-0 p-4 p-md-5" style="max-width: 640px;">
                <input type="hidden" th:field="*{id}">
                <div class="mb-3">
                    <label class="form-label">Supplier Name</label>
                    <input type="text" class="form-control" th:field="*{supplierName}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contact Person</label>
                    <input type="text" class="form-control" th:field="*{contactPerson}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Phone</label>
                    <input type="text" class="form-control" th:field="*{phone}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" th:field="*{email}">
                </div>
                                <div class="d-flex gap-2 mt-3 pt-2 border-top">
                    <button type="submit" class="btn btn-primary px-4">Save</button>
                    <a class="btn btn-outline-secondary" th:href="@{/suppliers}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
