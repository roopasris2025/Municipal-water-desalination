<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Suppliers')"></head>
<body>
<div class="d-flex">
    <div th:replace="fragments/sidebar :: sidebar('suppliers')"></div>
    <div class="flex-grow-1">
        <div class="topbar p-3 d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Suppliers</h4>
            <a class="btn btn-primary btn-sm" th:href="@{/suppliers/new}"><i class="bi bi-plus-lg me-1"></i>Add Supplier</a>
        </div>
        <div class="p-4">
            <div class="card content-card border-0">
                <div class="table-responsive">
                    <table class="table table-modern mb-0">
                <thead class="table-light">
                <tr><th>ID</th><th>Supplier Name</th><th>Contact Person</th><th>Phone</th><th>Email</th><th>Actions</th></tr>
                </thead>
                <tbody>
                <tr th:each="s : ${supplierList}">
                    <td th:text="${s.id}">1</td>
                    <td th:text="${s.supplierName}">Name</td>
                    <td th:text="${s.contactPerson}">Contact</td>
                    <td th:text="${s.phone}">Phone</td>
                    <td th:text="${s.email}">Email</td>
                    <td>
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/suppliers/edit/{id}(id=${s.id})}">Edit</a>
                        <a class="btn btn-sm btn-outline-danger" th:href="@{/suppliers/delete/{id}(id=${s.id})}"
                           onclick="return confirm('Delete this supplier?')">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
