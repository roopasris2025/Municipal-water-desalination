<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Products')"></head>
<body>
<div class="d-flex">
    <div th:replace="fragments/sidebar :: sidebar('products')"></div>
    <div class="flex-grow-1">
        <div class="topbar p-3 d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Products</h4>
            <a class="btn btn-primary btn-sm" th:href="@{/products/new}"><i class="bi bi-plus-lg me-1"></i>Add Product</a>
        </div>
        <div class="p-4">
            <div class="card content-card border-0">
                <div class="table-responsive">
                    <table class="table table-modern mb-0">
                <thead class="table-light">
                <tr><th>ID</th><th>Product Name</th><th>Type</th><th>Unit</th><th>Price</th><th>Actions</th></tr>
                </thead>
                <tbody>
                <tr th:each="p : ${productList}">
                    <td th:text="${p.id}">1</td>
                    <td th:text="${p.productName}">Name</td>
                    <td th:text="${p.productType}">Type</td>
                    <td th:text="${p.unit}">Unit</td>
                    <td th:text="${p.price}">Price</td>
                    <td>
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/products/edit/{id}(id=${p.id})}">Edit</a>
                        <a class="btn btn-sm btn-outline-danger" th:href="@{/products/delete/{id}(id=${p.id})}"
                           onclick="return confirm('Delete this product?')">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
