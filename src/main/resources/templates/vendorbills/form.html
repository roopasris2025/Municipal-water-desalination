<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('New Vendor Bill')"></head>
<body>
<div class="d-flex">
    <div th:replace="fragments/sidebar :: sidebar('vendor-bills')"></div>
    <div class="flex-grow-1">
        <div class="topbar p-3">
            <h4 class="mb-0">New Vendor Bill</h4>
        </div>
        <div class="p-4">
            <form th:action="@{/vendor-bills/save}" th:object="${bill}" method="post" class="card form-card border-0 p-4 p-md-5" style="max-width: 640px;">
                <div class="mb-3">
                    <label class="form-label">Bill Number</label>
                    <input type="text" class="form-control" th:field="*{billNumber}" placeholder="BILL-1001" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Supplier</label>
                    <select class="form-select" th:field="*{supplier.id}">
                        <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.supplierName}">Supplier</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Purchase Order</label>
                    <select class="form-select" th:field="*{purchaseOrder.id}">
                        <option th:each="p : ${purchaseOrders}" th:value="${p.id}" th:text="${p.poNumber} + ' (Rs. ' + ${p.totalAmount} + ')'">PO</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Amount</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{amount}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Bill Date</label>
                    <input type="date" class="form-control" th:field="*{billDate}">
                </div>
                                <div class="d-flex gap-2 mt-3 pt-2 border-top">
                    <button type="submit" class="btn btn-primary px-4">Save</button>
                    <a class="btn btn-outline-secondary" th:href="@{/vendor-bills}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
