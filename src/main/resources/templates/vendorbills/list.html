<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Vendor Bills')"></head>
<body>
<div class="d-flex">
    <div th:replace="fragments/sidebar :: sidebar('vendor-bills')"></div>
    <div class="flex-grow-1">
        <div class="topbar p-3 d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Vendor Bills</h4>
            <a class="btn btn-primary btn-sm" th:href="@{/vendor-bills/new}"><i class="bi bi-plus-lg me-1"></i>New Bill</a>
        </div>
        <div class="p-4">
            <div class="card content-card border-0">
                <div class="table-responsive">
                    <table class="table table-modern mb-0">
                <thead class="table-light">
                <tr><th>ID</th><th>Bill Number</th><th>Supplier</th><th>Purchase Order</th><th>Amount</th><th>Bill Date</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody>
                <tr th:each="b : ${billList}">
                    <td th:text="${b.id}">1</td>
                    <td th:text="${b.billNumber}">BILL-001</td>
                    <td th:text="${b.supplier?.supplierName}">Supplier</td>
                    <td th:text="${b.purchaseOrder?.poNumber}">PO-001</td>
                    <td th:text="${b.amount}">10000</td>
                    <td th:text="${b.billDate}">2026-01-01</td>
                    <td>
                        <span class="badge" th:classappend="${b.paymentStatus?.name() == 'PAID'} ? 'bg-success' : 'bg-warning'" th:text="${b.paymentStatus}">PENDING</span>
                    </td>
                    <td>
                        <a th:if="${b.paymentStatus?.name() == 'PENDING'}" class="btn btn-sm btn-success" th:href="@{/vendor-bills/pay/{id}(id=${b.id})}">Pay</a>
                        <a class="btn btn-sm btn-outline-danger" th:href="@{/vendor-bills/delete/{id}(id=${b.id})}"
                           onclick="return confirm('Delete this bill?')">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
