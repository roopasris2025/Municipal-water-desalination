<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('RO Trains')"></head>
<body>
<div class="d-flex">
    <div th:replace="fragments/sidebar :: sidebar('trains')"></div>
    <div class="flex-grow-1">
        <div class="topbar p-3 d-flex justify-content-between align-items-center">
            <h4 class="mb-0">RO Trains</h4>
            <a class="btn btn-primary btn-sm" th:href="@{/trains/new}"><i class="bi bi-plus-lg me-1"></i>Add Train</a>
        </div>
        <div class="p-4">
            <div class="card content-card border-0">
                <div class="table-responsive">
                    <table class="table table-modern mb-0">
                <thead class="table-light">
                <tr><th>ID</th><th>Train Name</th><th>Capacity/Day (m3)</th><th>Status</th><th>Pressure Limit (bar)</th><th>Actions</th></tr>
                </thead>
                <tbody>
                <tr th:each="t : ${trainList}">
                    <td th:text="${t.id}">1</td>
                    <td th:text="${t.trainName}">Train 1</td>
                    <td th:text="${t.capacityPerDay}">10000</td>
                    <td>
                        <span class="badge"
                              th:classappend="${t.status?.name() == 'ACTIVE'} ? 'bg-success' : (${t.status?.name() == 'MAINTENANCE'} ? 'bg-warning' : 'bg-secondary')"
                              th:text="${t.status}">ACTIVE</span>
                    </td>
                    <td th:text="${t.membranePressureLimit}">60</td>
                    <td>
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/trains/edit/{id}(id=${t.id})}">Edit</a>
                        <a class="btn btn-sm btn-outline-danger" th:href="@{/trains/delete/{id}(id=${t.id})}"
                           onclick="return confirm('Delete this train?')">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
