<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Telemetry')"></head>
<body>
<div class="d-flex">
    <div th:replace="fragments/sidebar :: sidebar('telemetry')"></div>
    <div class="flex-grow-1">
        <div class="topbar p-3 d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Telemetry Readings</h4>
            <a class="btn btn-primary btn-sm" th:href="@{/telemetry/new}"><i class="bi bi-plus-lg me-1"></i>Submit Reading</a>
        </div>
        <div class="p-4">
            <div class="card content-card border-0">
                <div class="table-responsive">
                    <table class="table table-modern mb-0">
                <thead class="table-light">
                <tr><th>ID</th><th>RO Train</th><th>Date</th><th>Intake Pressure (bar)</th><th>Salinity (ppm)</th><th>Water Produced (m3)</th><th>Mineral Recovered (kg)</th><th>Actions</th></tr>
                </thead>
                <tbody>
                <tr th:each="t : ${telemetryList}">
                    <td th:text="${t.id}">1</td>
                    <td th:text="${t.roTrain?.trainName}">Train 1</td>
                    <td th:text="${t.recordDate}">2026-01-01</td>
                    <td th:text="${t.intakePressure}">55</td>
                    <td th:text="${t.salinity}">35000</td>
                    <td th:text="${t.waterProduced}">4500</td>
                    <td th:text="${t.mineralRecovered}">500</td>
                    <td>
                        <a class="btn btn-sm btn-outline-danger" th:href="@{/telemetry/delete/{id}(id=${t.id})}"
                           onclick="return confirm('Delete this reading?')">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
