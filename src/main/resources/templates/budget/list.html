<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Budget')"></head>
<body>
<div class="d-flex">
    <div th:replace="fragments/sidebar :: sidebar('budget')"></div>
    <div class="flex-grow-1">
        <div class="topbar p-3 d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Budgets</h4>
            <a class="btn btn-primary btn-sm" th:href="@{/budget/new}"><i class="bi bi-plus-lg me-1"></i>Add Budget</a>
        </div>
        <div class="p-4">
            <div class="card content-card border-0">
                <div class="table-responsive">
                    <table class="table table-modern mb-0">
                <thead class="table-light">
                <tr><th>ID</th><th>Budget Name</th><th>Financial Year</th><th>Planned</th><th>Actual</th><th>Remaining</th><th>Used %</th><th>Actions</th></tr>
                </thead>
                <tbody>
                <tr th:each="b : ${budgetList}">
                    <td th:text="${b.id}">1</td>
                    <td th:text="${b.budgetName}">Annual Budget</td>
                    <td th:text="${b.financialYear}">2026-27</td>
                    <td th:text="${b.plannedAmount}">1000000</td>
                    <td th:text="${b.actualAmount}">400000</td>
                    <td th:text="${b.plannedAmount - b.actualAmount}">600000</td>
                    <td th:text="${#numbers.formatDecimal(usedPercentMap.get(b.id), 1, 1)} + '%'">40%</td>
                    <td>
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/budget/edit/{id}(id=${b.id})}">Edit</a>
                        <a class="btn btn-sm btn-outline-danger" th:href="@{/budget/delete/{id}(id=${b.id})}"
                           onclick="return confirm('Delete this budget?')">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
