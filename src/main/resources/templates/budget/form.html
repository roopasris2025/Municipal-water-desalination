<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Budget Form')"></head>
<body>
<div class="d-flex">
    <div th:replace="fragments/sidebar :: sidebar('budget')"></div>
    <div class="flex-grow-1">
        <div class="topbar p-3">
            <h4 class="mb-0" th:text="${budget.id == null} ? 'Add Budget' : 'Edit Budget'">Add</h4>
        </div>
        <div class="p-4">
            <form th:action="@{/budget/save}" th:object="${budget}" method="post" class="card form-card border-0 p-4 p-md-5" style="max-width: 640px;">
                <input type="hidden" th:field="*{id}">
                <div class="mb-3">
                    <label class="form-label">Budget Name</label>
                    <input type="text" class="form-control" th:field="*{budgetName}" placeholder="Annual Operations Budget" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Financial Year</label>
                    <input type="text" class="form-control" th:field="*{financialYear}" placeholder="2026-27">
                </div>
                <div class="mb-3">
                    <label class="form-label">Planned Amount (Rs.)</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{plannedAmount}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Actual Amount (Rs.)</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{actualAmount}">
                </div>
                                <div class="d-flex gap-2 mt-3 pt-2 border-top">
                    <button type="submit" class="btn btn-primary px-4">Save</button>
                    <a class="btn btn-outline-secondary" th:href="@{/budget}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
