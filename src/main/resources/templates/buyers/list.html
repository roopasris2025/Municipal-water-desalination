<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Mineral Buyers')"></head>
<body>
<div class="d-flex">
    <div th:replace="fragments/sidebar :: sidebar('buyers')"></div>
    <div class="flex-grow-1">
        <div class="topbar p-3 d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Mineral Buyers</h4>
            <a class="btn btn-primary btn-sm" th:href="@{/buyers/new}"><i class="bi bi-plus-lg me-1"></i>Add Buyer</a>
        </div>
        <div class="p-4">
            <div class="card content-card border-0">
                <div class="table-responsive">
                    <table class="table table-modern mb-0">
                <thead class="table-light">
                <tr><th>ID</th><th>Buyer Name</th><th>Contact Person</th><th>Phone</th><th>Email</th><th>Actions</th></tr>
                </thead>
                <tbody>
                <tr th:each="b : ${buyerList}">
                    <td th:text="${b.id}">1</td>
                    <td th:text="${b.buyerName}">Name</td>
                    <td th:text="${b.contactPerson}">Contact</td>
                    <td th:text="${b.phone}">Phone</td>
                    <td th:text="${b.email}">Email</td>
                    <td>
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/buyers/edit/{id}(id=${b.id})}">Edit</a>
                        <a class="btn btn-sm btn-outline-danger" th:href="@{/buyers/delete/{id}(id=${b.id})}"
                           onclick="return confirm('Delete this buyer?')">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
