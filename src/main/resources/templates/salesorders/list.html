<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Sales Orders')"></head>
<body>
<div class="d-flex">
    <div th:replace="fragments/sidebar :: sidebar('sales-orders')"></div>
    <div class="flex-grow-1">
        <div class="topbar p-3 d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Sales Orders</h4>
            <a class="btn btn-primary btn-sm" th:href="@{/sales-orders/new}"><i class="bi bi-plus-lg me-1"></i>New Sales Order</a>
        </div>
        <div class="p-4">
            <div class="card content-card border-0">
                <div class="table-responsive">
                    <table class="table table-modern mb-0">
                <thead class="table-light">
                <tr><th>ID</th><th>SO Number</th><th>Customer</th><th>Product</th><th>Qty</th><th>Unit Price</th><th>Total</th><th>Status</th><th>Date</th><th>Actions</th></tr>
                </thead>
                <tbody>
                <tr th:each="so : ${soList}">
                    <td th:text="${so.id}">1</td>
                    <td th:text="${so.salesOrderNumber}">SO-001</td>
                    <td th:text="${so.customer?.name}">Authority</td>
                    <td th:text="${so.product?.productName}">Water</td>
                    <td th:text="${so.quantity}">4000</td>
                    <td th:text="${so.unitPrice}">50</td>
                    <td th:text="${so.totalAmount}">200000</td>
                    <td th:text="${so.status}">CREATED</td>
                    <td th:text="${so.orderDate}">2026-01-01</td>
                    <td>
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/sales-orders/edit/{id}(id=${so.id})}">Edit</a>
                        <a class="btn btn-sm btn-outline-danger" th:href="@{/sales-orders/delete/{id}(id=${so.id})}"
                           onclick="return confirm('Delete this sales order?')">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
