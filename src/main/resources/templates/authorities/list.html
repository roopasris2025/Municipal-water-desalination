<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Water Authorities')"></head>
<body>
<div class="d-flex">
    <div th:replace="fragments/sidebar :: sidebar('authorities')"></div>
    <div class="flex-grow-1">
        <div class="topbar p-3 d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Municipal Water Authorities</h4>
            <a class="btn btn-primary btn-sm" th:href="@{/authorities/new}"><i class="bi bi-plus-lg me-1"></i>Add Authority</a>
        </div>
        <div class="p-4">
            <div class="card content-card border-0">
                <div class="table-responsive">
                    <table class="table table-modern mb-0">
                <thead class="table-light">
                <tr><th>ID</th><th>Name</th><th>Contact Person</th><th>Phone</th><th>Email</th><th>Address</th><th>Actions</th></tr>
                </thead>
                <tbody>
                <tr th:each="a : ${authorityList}">
                    <td th:text="${a.id}">1</td>
                    <td th:text="${a.name}">Name</td>
                    <td th:text="${a.contactPerson}">Contact</td>
                    <td th:text="${a.phone}">Phone</td>
                    <td th:text="${a.email}">Email</td>
                    <td th:text="${a.address}">Address</td>
                    <td>
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/authorities/edit/{id}(id=${a.id})}">Edit</a>
                        <a class="btn btn-sm btn-outline-danger" th:href="@{/authorities/delete/{id}(id=${a.id})}"
                           onclick="return confirm('Delete this authority?')">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
