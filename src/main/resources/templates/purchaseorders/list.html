<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Purchase Orders')"></head>
<body>
<div class="d-flex">
    <div th:replace="fragments/sidebar :: sidebar('purchase-orders')"></div>
    <div class="flex-grow-1">
        <div class="topbar p-3 d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Purchase Orders</h4>
            <a class="btn btn-primary btn-sm" th:href="@{/purchase-orders/new}"><i class="bi bi-plus-lg me-1"></i>New PO</a>
        </div>
        <div class="p-4">
            <div class="card content-card border-0">
                <div class="table-responsive">
                    <table class="table table-modern mb-0">
                <thead class="table-light">
                <tr><th>ID</th><th>PO Number</th><th>Supplier</th><th>Product</th><th>Qty</th><th>Unit Price</th><th>Total</th><th>Status</th><th>Date</th><th>Actions</th></tr>
                </thead>
                <tbody>
                <tr th:each="po : ${poList}">
                    <td th:text="${po.id}">1</td>
                    <td th:text="${po.poNumber}">PO-001</td>
                    <td th:text="${po.supplier?.supplierName}">Supplier</td>
                    <td th:text="${po.product?.productName}">Product</td>
                    <td th:text="${po.quantity}">10</td>
                    <td th:text="${po.unitPrice}">1000</td>
                    <td th:text="${po.totalAmount}">10000</td>
                    <td th:text="${po.status}">CREATED</td>
                    <td th:text="${po.orderDate}">2026-01-01</td>
                    <td>
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/purchase-orders/edit/{id}(id=${po.id})}">Edit</a>
                        <a class="btn btn-sm btn-outline-danger" th:href="@{/purchase-orders/delete/{id}(id=${po.id})}"
                           onclick="return confirm('Delete this PO?')">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
