<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Inventory')"></head>
<body>
<div class="d-flex">
    <div th:replace="fragments/sidebar :: sidebar('inventory')"></div>
    <div class="flex-grow-1">
        <div class="topbar p-3">
            <h4 class="mb-0">Inventory</h4>
        </div>
        <div class="p-4">
            <p class="text-muted">Stock updates automatically from Telemetry (water/mineral produced),
                Purchase Orders (membranes received) and Sales Orders (water sold).</p>
            <div class="card content-card border-0">
                <div class="table-responsive">
                    <table class="table table-modern mb-0">
                <thead class="table-light">
                <tr><th>ID</th><th>Item</th><th>Unit</th><th>Quantity</th></tr>
                </thead>
                <tbody>
                <tr th:each="i : ${inventoryList}">
                    <td th:text="${i.id}">1</td>
                    <td th:text="${i.itemName}">DESALINATED_WATER</td>
                    <td th:text="${i.unit}">m3</td>
                    <td th:text="${#numbers.formatDecimal(i.quantity, 1, 2)}">0</td>
                </tr>
                <tr th:if="${#lists.isEmpty(inventoryList)}">
                    <td colspan="4" class="text-muted">No inventory movements yet.</td>
                </tr>
                </tbody>
            </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
